<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ChatSphere — Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        :root {
            --color-bg-base: #F0F2F5;
            --color-bg-surface: #FFFFFF;
            --color-primary: #25D366;
            --color-primary-dark: #1EBE58;
            --color-header: #075E54;
            --color-text-primary: #111B21;
            --color-text-secondary: #667781;
            --color-border: #E9EDEF;
            --radius-sm: 4px;
            --radius-md: 8px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg-base);
            color: var(--color-text-primary);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        }
        .input-field {
            @apply w-full border border-[var(--color-border)] px-4 py-2.5 outline-none transition-colors;
            border-radius: var(--radius-sm);
            height: 44px;
        }
        .input-field:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 1px var(--color-primary);
        }
        .primary-button {
            @apply w-full text-white font-semibold transition-colors flex items-center justify-center;
            background-color: var(--color-primary);
            border-radius: var(--radius-sm);
            height: 44px;
        }
        .primary-button:hover {
            background-color: var(--color-primary-dark);
        }
    </style>
</head>
<body class="min-h-screen flex">
<div class="hidden lg:flex lg:w-[40%] bg-[var(--color-header)] flex-col items-center justify-center p-12 text-center">
<div class="mb-6">
<span class="material-symbols-outlined text-white text-[64px]">forum</span>
</div>
<h1 class="text-white text-3xl font-bold mb-2">ChatSphere</h1>
<p class="text-white/75 text-sm max-w-[240px]">Simple, fast, real-time messaging.</p>
</div>
<div class="w-full lg:w-[60%] bg-white flex flex-col items-center justify-center p-6 lg:p-12 relative">
<div class="absolute top-8 right-8">
<button class="p-2 text-[var(--color-text-secondary)] hover:bg-[var(--color-bg-base)] rounded-full transition-colors group" title="Toggle theme">
<span class="material-symbols-outlined">light_mode</span>
</button>
</div>
<div class="lg:hidden mb-8 text-center">
<div class="inline-flex items-center justify-center p-3 bg-[var(--color-header)] rounded-xl mb-4">
<span class="material-symbols-outlined text-white text-4xl">forum</span>
</div>
<h1 class="text-2xl font-bold text-[var(--color-text-primary)]">ChatSphere</h1>
</div>
<div class="w-full max-w-[400px]">
<header class="mb-8">
<h2 class="text-2xl font-bold text-[var(--color-text-primary)] mb-1">Welcome back</h2>
<p class="text-[var(--color-text-secondary)] text-sm">Sign in to continue</p>
</header>
<form class="space-y-6">
<div>
<label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-1.5" for="email">
                        Email address
                    </label>
<input autocomplete="email" class="input-field" id="email" placeholder="you@example.com" required="" type="email"/>
</div>
<div>
<label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-1.5" for="password">
                        Password
                    </label>
<div class="relative">
<input autocomplete="current-password" class="input-field pr-10" id="password" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-[var(--color-text-secondary)] hover:text-[var(--color-text-primary)]" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<div class="flex justify-end mt-2">
<a class="text-xs text-[var(--color-primary)] font-medium hover:underline" href="#">Forgot password?</a>
</div>
</div>
<button class="primary-button" type="submit">
                    Sign In
                </button>
<div class="text-center pt-2">
<p class="text-sm text-[var(--color-text-secondary)]">
                        Don't have an account? 
                        <a class="text-[var(--color-primary)] font-semibold hover:underline ml-1" href="#">Register</a>
</p>
</div>
</form>
<footer class="mt-12 pt-8 border-t border-[var(--color-border)] text-center">
<p class="text-xs text-[var(--color-text-secondary)] opacity-60">
                    © 2025 ChatSphere. All rights reserved.
                </p>
</footer>
</div>
</div>

</body></html>
